[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmha_sm100"
version = "0.1.1"
description = "MSA — MiniMax Sparse Attention: dense FlashAttention + sparse top-k indexer (csrc JIT) and CuTe-DSL sparse attention for NVIDIA SM100"
readme = "README.md"
requires-python = ">=3.10"
# SPDX-License-Identifier: MIT
license = { text = "MIT" }
authors = [{ name = "MiniMax" }]
dependencies = [
    "torch",
    "apache-tvm-ffi",
    "jinja2",
    "ninja",
    "pybind11",
    "cuda-python",
    "numpy",
    "nvidia-cutlass-dsl>=4.6.0",
    "quack-kernels>=0.6.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# KV-outer sparse prefill (fmha_sm100.kvouter) is written against the
# FlashAttention-4 CuTe internals of 4.0.0b15, which import only with
# nvidia-cutlass-dsl 4.5.x (4.6 removed cute.core.ThrMma). Until kvouter is
# ported to flash-attn-4 4.0.0b30, use it on the 4.5.x stack
# (nvidia-cutlass-dsl 4.5.x, quack-kernels 0.4.x); the legacy CuTe kernels run
# on both stacks.
kvouter = ["flash-attn-4==4.0.0b15"]

[project.scripts]
msa-icp-build-check = "fmha_sm100.icp._build:main"
msa-icp-prewarm = "fmha_sm100.icp.prewarm:main"

[project.urls]

# The Python package lives under python/. Both kernel stacks ship as package
# data and work from both editable and wheel installs:
#   * Dense csrc/ kernels are JIT-compiled at runtime (python/fmha_sm100/jit.py).
#     The CUDA sources, Jinja templates, and vendored CUTLASS headers live inside
#     the package directory so that JIT can locate them via __file__.
#   * The CuTe-DSL sparse stack (python/fmha_sm100/cute/) is exposed through the
#     importable `fmha_sm100.sparse` module (and lazily from the package root),
#     which uses package-relative imports and re-exports the public sparse API.
# Native sources and pinned CUTLASS headers are runtime JIT inputs.
[tool.setuptools]
package-dir = { "" = "python" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["fmha_sm100", "fmha_sm100.*"]
exclude = ["fmha_sm100.cutlass*"]
namespaces = true

[tool.setuptools.package-data]
fmha_sm100 = [
    "cute/**/*.py", "cute/**/*.cu", "cute/**/*.cuh", "cute/**/*.h",
    "cute/**/*.hpp", "cute/**/*.md", "cute/**/*.ini", "cute/**/*.txt",
    "cute/Makefile", "csrc/**/*", "decode_q8kv4/csrc/**/*",
    "prefill_q8kv4/csrc/**/*", "cutlass/include/**/*",
    "cutlass/tools/util/include/**/*", "cutlass/LICENSE*", "cutlass/NOTICE*",
    "cutlass/SOURCE.json",
]
"fmha_sm100.icp" = ["csrc/*.cu", "csrc/*.cuh", "abi/*.json", "COMMIT"]

[tool.setuptools.exclude-package-data]
"*" = ["**/*.pyc", "**/*.pyo", "**/*.so", "**/*.o", "**/*.a",
       "**/*.ptx", "**/*.cubin"]

[tool.pytest.ini_options]
markers = [
    "gpu: needs one CUDA device",
    "distributed: needs an initialised process group with world_size >= 2",
]
